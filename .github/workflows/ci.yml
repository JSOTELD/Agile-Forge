name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contrato (PHP ${{ matrix.php }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, php: '8.0' }
          - { os: ubuntu-latest, php: '8.3' }
          - { os: windows-latest, php: '8.2' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, mbstring
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Instalar dependencias del servidor MCP
        working-directory: mcp-server
        run: npm ci

      - name: Tipos del servidor MCP
        working-directory: mcp-server
        run: npm run check

      - name: Los bundles de los plugins están al día
        if: matrix.os == 'ubuntu-latest' && matrix.php == '8.3'
        shell: bash
        run: |
          cd mcp-server && npm run build && npm run bundle && cd ..
          if ! git -c core.fileMode=false diff --exit-code -- plugin/agileforge/server plugin/agileforge-vista/server; then
            echo "::error::Los bundles no coinciden con mcp-server/src. Ejecuta 'npm run build && npm run bundle' en mcp-server y commitea."
            exit 1
          fi

      - name: Pruebas de contrato (API, MCP y repositorio)
        run: node tests/run.mjs

  install:
    name: Instalación en limpio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, mbstring, curl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm run setup
        run: npm run setup

      - name: npm run doctor
        run: npm run doctor

      - name: npm test
        run: npm test

      - name: "npm run setup (segunda vez: idempotencia)"
        run: npm run setup

      - name: Verificar git status limpio
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::git status no está limpio tras setup:"
            git status --porcelain
            exit 1
          fi

  plugin-validate:
    name: Validación del plugin (Claude Code)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informativo: depende del CLI publicado en npm, así que no bloquea el merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: claude plugin validate
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate plugin/agileforge
          npx --yes @anthropic-ai/claude-code plugin validate plugin/agileforge-vista
          npx --yes @anthropic-ai/claude-code plugin validate .
